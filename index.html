<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchtower SetReady</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #16181d; --muted: #667085; --line: #dde1e7;
    --green: #16803c; --go: #16803c; --red: #c62828; --amber: #b26a00; --grey: #8a93a3;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1b1e24; --text: #eceef2; --muted: #9aa3b2; --line: #2c313a;
            --green: #35b765; --go: #1c8f45; --red: #ef5350; --amber: #f0a22e; --grey: #6b7484; }
  }
  :root { --page: 1900px; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  /* Row 1: title + Settings. Row 2: counts + last update. Same on phone and desktop. */
  header { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 12px;
           padding: 16px; max-width: var(--page); margin: 0 auto; }
  h1 { font-size: 20px; margin: 0; }
  #open-settings { grid-row: 1; grid-column: 2; justify-self: end; }
  #summary { grid-row: 2; grid-column: 1; color: var(--muted); font-size: 14px; }
  #updated { grid-row: 2; grid-column: 2; color: var(--muted); font-size: 13px;
             text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #banner { display: none; max-width: calc(var(--page) - 32px); margin: 0 auto 12px; padding: 10px 14px;
            border-radius: 8px; background: var(--red); color: #fff; font-size: 14px; }
  #banner.show { display: block; }
  /* Columns are set by layout() from the screen width and the number of printers, so rows
     come out even (6 printers: 6x1, 3x2, 2x3 or 1x6) instead of leaving one on its own. */
  main { display: grid; gap: 12px; padding: 0 16px 24px; max-width: var(--page); margin: 0 auto;
         grid-template-columns: repeat(var(--cols, 1), minmax(0, var(--cardw, 680px)));
         justify-content: center; }
  .empty { grid-column: 1 / -1; color: var(--muted); padding: 32px 0; text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
          padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .cam { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px;
         background: #000; display: block; }
  .cam[hidden] { display: none; }
  #camnote { max-width: var(--page); margin: -8px auto 10px; padding: 0 16px; font-size: 13px;
             color: var(--muted); }
  .name { font-weight: 600; overflow-wrap: anywhere; }
  .model { color: var(--muted); font-size: 13px; }
  .model:empty, .eta:empty, .msg:empty { display: none; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .eta { font-size: 13px; color: var(--muted); margin-top: -6px;
         font-variant-numeric: tabular-nums; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); flex: none; }
  .printing .dot { animation: breathe 2.4s ease-in-out infinite; }
  .paused .dot { animation: breathe .5s steps(2) infinite; }
  @keyframes breathe { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none !important; } }
  .ready { --c: var(--green); } .plate, .printing, .paused { --c: var(--red); }
  .offline { --c: var(--amber); }
  button { font: inherit; font-weight: 600; min-height: 56px; border-radius: 10px;
           border: 2px solid var(--c); background: transparent; color: var(--c);
           cursor: default; opacity: .65; }
  .paused button { cursor: pointer; opacity: 1; }
  .paused.armed button { background: var(--red); color: #fff; }
  .paused button:hover { filter: brightness(1.1); }
  /* Set Ready is the one button you are meant to press, so it is solid green. */
  .plate button { background: var(--go); border-color: var(--go); color: #fff; cursor: pointer;
                  opacity: 1; }
  .plate button:hover { filter: brightness(1.1); }
  .plate button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .card.sending button { opacity: .6; cursor: progress; }
  button.plain { min-height: 36px; padding: 0 14px; border: 1px solid var(--line);
                 color: var(--text); opacity: 1; cursor: pointer; font-weight: 500; font-size: 14px; }
  button.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  dialog { width: min(440px, calc(100vw - 32px)); border: 1px solid var(--line);
           border-radius: 12px; background: var(--card); color: var(--text); padding: 20px; }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  dialog h2 { font-size: 18px; margin: 0 0 14px; }
  dialog label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 14px; }
  dialog input:not([type=checkbox]) { display: block; width: 100%; margin-top: 4px; padding: 9px 10px;
           font: inherit; color: var(--text); background: var(--bg);
           border: 1px solid var(--line); border-radius: 8px; }
  dialog small { display: block; font-weight: 400; color: var(--muted); margin-top: 4px; }
  dialog .check { display: flex; gap: 10px; align-items: flex-start; }
  dialog .check input { margin-top: 3px; }
  dialog fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 14px;
                    padding: 10px 12px 12px; }
  dialog legend { font-size: 14px; font-weight: 600; padding: 0 4px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 8px; }
  .btns { display: flex; gap: 8px; margin-top: auto; }   /* buttons line up along the row */
  .btns .main { flex: 1; min-width: 0; }
  .card button.mini { flex: none; width: 52px; padding: 0; display: none; place-items: center;
                      background: transparent; color: var(--text); border: 2px solid var(--line);
                      opacity: 1; cursor: pointer; }
  .card button.mini:hover { border-color: var(--text); filter: none; }
  .card button.mini svg { width: 20px; height: 20px; fill: currentColor; }
  .printing button.mini, .paused button.stop { display: grid; }
  .card.sending button.mini { opacity: .4; cursor: progress; }
  button.danger { background: var(--red); color: #fff; border-color: var(--red); }
  #confirm p { margin: 0 0 16px; color: var(--muted); font-size: 15px; }
  .msg { font-size: 13px; color: var(--red); }
  /* Filament: round swatches for what is loaded, labelled chips for what a job needs */
  .loaded { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px;
            color: var(--muted); }
  .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--grey);
        background: var(--sw, transparent); flex: none; display: inline-block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 5px;
          border: 1px solid var(--line); border-radius: 999px; font-size: 13px; white-space: nowrap; }
  .chip.missing { border-color: var(--red); border-style: dashed; }
  .needs { font-size: 13px; display: flex; flex-direction: column; gap: 6px; }
  .needs b { font-weight: 600; color: var(--red); }
  .needs b.good { color: var(--green); }
  .loaded:empty, .needs:empty { display: none; }
  #queue { max-width: var(--page); margin: 0 auto; padding: 0 16px 32px; }
  .qhead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
           gap: 4px 16px; margin-bottom: 10px; }
  .qhead label { font-size: 14px; color: var(--muted); display: flex; align-items: center;
                 gap: 6px; cursor: pointer; }
  #queue h2 { font-size: 16px; margin: 0; }
  #queue h2 span { color: var(--muted); font-weight: 400; font-size: 14px; }
  .job { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
         padding: 12px 14px; margin-bottom: 8px; display: grid; gap: 8px;
         grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); align-items: start; }
  .job.blocked { border-left: 4px solid var(--red); }
  .job.ok { border-left: 4px solid var(--green); }      /* a printer has every filament */
  .job .jname { font-weight: 600; overflow-wrap: anywhere; }
  .job .jmeta { color: var(--muted); font-size: 13px; }
  .job .verdict { font-size: 14px; margin-top: 6px; }
  .job .verdict b { color: var(--red); }
  .lack { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
          vertical-align: middle; }
  .job .reason { color: var(--muted); font-size: 12px; margin-top: 4px; }
  @media (max-width: 700px) { .job { grid-template-columns: minmax(0, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>Watchtower SetReady</h1>
  <span id="summary"></span>
  <span id="updated"></span>
  <button type="button" id="open-settings" class="plain">Settings</button>
</header>
<dialog id="settings">
  <form id="settings-form">
    <h2>Watchtower connection</h2>
    <label>Watchtower address
      <input id="cfg-url" required autocomplete="off" spellcheck="false"
             placeholder="192.168.1.50 or https://192.168.1.50:8443">
      <small>IP address or name of the Watchtower computer. Add <code>http://</code> or a
        port if yours needs one; <code>https://</code> is assumed otherwise.</small>
    </label>
    <label>API key
      <input id="cfg-key" type="password" autocomplete="off" placeholder="wt_…">
      <small id="cfg-key-hint"></small>
    </label>
    <label class="check"><input id="cfg-insecure" type="checkbox">
      <span>Skip the certificate check
        <small>Needed for https unless Watchtower's CA certificate file is set on the
          server. The connection is still encrypted, but not verified.</small></span>
    </label>
    <fieldset>
      <legend>Cameras and queue (optional)</legend>
      <label>Watchtower username
        <input id="cfg-user" autocomplete="off" spellcheck="false" autocapitalize="none">
      </label>
      <label>Watchtower password
        <input id="cfg-pass" type="password" autocomplete="off">
        <small id="cfg-pass-hint"></small>
      </label>
      <small>Camera pictures, the waiting-jobs list and loaded filament aren't covered by
        the API key, so they need a Watchtower login. Leave the username blank for none.</small>
    </fieldset>
    <fieldset>
      <legend>Page password</legend>
      <label>New password
        <input id="cfg-pagepass" type="password" autocomplete="new-password" minlength="8">
        <small id="cfg-pagepass-hint"></small>
      </label>
      <label class="check" id="cfg-remove-row" hidden><input id="cfg-remove" type="checkbox">
        <span>Remove the password
          <small>Anyone who can reach this page will be able to use it.</small></span>
      </label>
    </fieldset>
    <div id="cfg-error" class="msg" role="alert"></div>
    <div class="actions">
      <button type="button" id="cfg-logout" class="plain" hidden style="margin-right:auto">Log out</button>
      <button type="button" id="cfg-cancel" class="plain">Cancel</button>
      <button type="submit" class="plain primary">Save</button>
    </div>
  </form>
</dialog>
<dialog id="login" aria-labelledby="login-title">
  <form id="login-form">
    <h2 id="login-title">Log in</h2>
    <label>Password
      <input id="login-pass" type="password" autocomplete="current-password" required>
    </label>
    <div id="login-error" class="msg" role="alert"></div>
    <div class="actions"><button type="submit" class="plain primary">Log in</button></div>
  </form>
</dialog>
<dialog id="confirm" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <p id="confirm-text"></p>
  <div class="actions">
    <button type="button" id="confirm-cancel" class="plain">Keep printing</button>
    <button type="button" id="confirm-ok" class="plain danger"></button>
  </div>
</dialog>
<div id="banner" role="alert"></div>
<div id="camnote"></div>
<main id="grid"><p class="empty">Loading printers…</p></main>
<section id="queue" hidden>
  <div class="qhead">
    <h2>Waiting jobs <span id="queue-count"></span></h2>
    <label><input type="checkbox" id="hide-ok"> Hide jobs with filament loaded</label>
  </div>
  <div id="queue-list"></div>
</section>

<script>
const POLL_MS = 5000;
const grid = document.getElementById('grid');
const banner = document.getElementById('banner');
const cards = new Map();      // printer name -> {el, state}
const pending = new Map();    // printer name -> time until which we show "ready" optimistically
const errors = new Map();     // printer name -> last button error
let timer = null;

const LABEL = {
  ready:    ['Ready for the next job',  'Ready'],
  plate:    ['Plate needs clearing',    'Plate cleared – Set Ready'],
  printing: ['Printing',                'Printing'],
  paused:   ['Paused or error',         'Resume print'],
  offline:  ['Offline',                 'Offline'],
};

// Pick the columns and card width from the screen size and the number of printers.
// 1. If some arrangement shows every printer without scrolling, use the one with the
//    biggest cards (a 1080p wall screen with 6 printers gets 3 x 2 large cards, not 6 x 1).
// 2. Otherwise use as many columns as fit, evened out so no printer sits alone on a row.
const CARD_MIN = 250, CARD_MAX = 680, GAP = 12, CAM_ASPECT = 9 / 16;
function layout() {
  const n = cards.size || 1;
  const width = grid.clientWidth - 32;                       // minus side padding
  const queueEl = document.getElementById('queue');
  const height = window.innerHeight - grid.offsetTop - 24    // room below the header...
               - (queueEl.hidden ? 0 : queueEl.offsetHeight); // ...and above the queue
  const fit = Math.max(1, Math.floor((width + GAP) / (CARD_MIN + GAP)));
  // Card height = camera picture (scales with width) + everything else (fixed).
  let hasCam = false, chrome = 0;
  for (const c of cards.values()) {
    const cam = c.el.querySelector('.cam');
    hasCam = hasCam || !cam.hidden;
    chrome = Math.max(chrome, c.el.offsetHeight - (cam.hidden ? 0 : cam.offsetHeight));
  }
  chrome = chrome || 190;
  let best = null;
  for (let rows = 1; hasCam && rows <= n; rows++) {
    const cols = Math.ceil(n / rows);
    if (cols > fit) continue;
    const byWidth = Math.min(CARD_MAX, (width - (cols - 1) * GAP) / cols);
    const rowHeight = (height - (rows - 1) * GAP) / rows;
    const byHeight = (rowHeight - chrome - 10) / CAM_ASPECT;      // 10: gap under the picture
    const w = Math.floor(Math.min(byWidth, byHeight));
    // Don't shrink cards below 60% of the width they could have just to avoid scrolling.
    if (w >= CARD_MIN && w >= 0.6 * byWidth && (!best || w > best.w)) best = { cols, w };
  }
  // Scrolling needed, or no pictures to enlarge (plain cards stay compact).
  if (!best) best = { cols: Math.ceil(n / Math.ceil(n / fit)), w: hasCam ? CARD_MAX : 380 };
  grid.style.setProperty('--cols', best.cols);
  grid.style.setProperty('--cardw', best.w + 'px');
}
new ResizeObserver(layout).observe(grid);
window.addEventListener('resize', layout);

// Same rules as the ClearCue button: offline = !online; busy = printing (paused/error if a
// status string says so); ready = ready && online; otherwise the plate is waiting.
function stateOf(p) {
  if (!p.online) return 'offline';
  if (p.busy) {
    const s = ['status', 'state', 'print_state', 'printStatus', 'job_status', 'gcode_state']
      .map(k => typeof p[k] === 'string' ? p[k].toUpperCase() : '').join(' ');
    return /PAUSE|ERROR|FAULT|HALT/.test(s) ? 'paused' : 'printing';
  }
  return p.ready ? 'ready' : 'plate';
}

// Minutes left on the current job, or null. Watchtower's field is eta_minutes; the other
// names are fallbacks in case a version reports it differently.
function minutesLeft(p) {
  const num = v => typeof v === 'number' && isFinite(v) && v >= 0 ? v : null;
  for (const k of ['eta_minutes', 'remaining_minutes', 'time_remaining_minutes', 'minutes_remaining']) {
    const v = num(p[k]); if (v !== null) return v;
  }
  for (const k of ['eta_seconds', 'remaining_seconds', 'time_remaining_seconds', 'time_remaining']) {
    const v = num(p[k]); if (v !== null) return v / 60;
  }
  for (const k of ['eta', 'estimated_end', 'finish_time', 'end_time']) {
    const t = typeof p[k] === 'string' ? Date.parse(p[k]) : NaN;
    if (!isNaN(t)) return Math.max(0, (t - Date.now()) / 60000);
  }
  return null;
}

// "1h 23m left · done 14:35" (with the weekday if it finishes on another day)
function etaText(p, withFinish) {
  const m = minutesLeft(p);
  if (m === null) return '';
  const mins = Math.round(m), h = Math.floor(mins / 60);
  const left = mins < 1 ? 'Under a minute left' : (h ? h + 'h ' : '') + (mins % 60) + 'm left';
  if (!withFinish) return left;        // a paused job has no meaningful finish time
  const end = new Date(Date.now() + m * 60000);
  const opts = { hour: 'numeric', minute: '2-digit' };
  if (end.toDateString() !== new Date().toDateString()) opts.weekday = 'short';
  return left + ' · done ' + end.toLocaleTimeString([], opts);
}

// Accept {data:{printers:[...]}}, {data:[...]}, {printers:[...]} or a bare array.
function printersFrom(json) {
  const d = json && json.data !== undefined ? json.data : json;
  const list = Array.isArray(d) ? d : d && Array.isArray(d.printers) ? d.printers : null;
  if (!list) throw new Error('Watchtower replied, but not with a printer list. ' +
                             'Check that the base URL ends in /api/public/v1.');
  return list.filter(p => p && typeof p.name === 'string');
}

function explain(status, text) {
  let detail = '';
  try { const j = JSON.parse(text); detail = j.error && j.error.message || j.error || j.message || ''; }
  catch { detail = ''; }
  if (typeof detail !== 'string') detail = JSON.stringify(detail);
  if (status === 401) return 'Watchtower rejected the API key.';
  if (status === 403) return /FEATURE_NOT_LICENSED/.test(text)
    ? "Your Watchtower plan doesn't include API access."
    : 'The API key is not allowed to do this. It needs the control scope and permission for this command.';
  if (status === 404) return 'Not found. Check that the base URL ends in /api/public/v1.';
  if (status === 429) return 'Watchtower is rate-limiting requests. Trying again shortly.';
  return detail || 'Watchtower returned HTTP ' + status + '.';
}

function render(printers) {
  const seen = new Set();
  const counts = { ready: 0, plate: 0, printing: 0, paused: 0, offline: 0 };
  printers.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  if (!printers.length) {
    cards.clear();
    grid.innerHTML = '<p class="empty">Watchtower has no printers.</p>';
  } else if (grid.querySelector('.empty')) grid.innerHTML = '';

  for (const p of printers) {
    seen.add(p.name);
    let state = stateOf(p);
    if (pending.has(p.name)) {            // just pressed: hold "ready" until Watchtower catches up
      if (state === 'plate' && Date.now() < pending.get(p.name)) state = 'ready';
      else pending.delete(p.name);
    }
    if (errors.has(p.name) && errors.get(p.name).state !== state) errors.delete(p.name);
    const armed = state === 'paused' && Date.now() < (confirmUntil.get(p.name) || 0);
    counts[state]++;

    let c = cards.get(p.name);
    if (!c) {
      const el = document.createElement('section');
      el.innerHTML = '<img class="cam" alt="" hidden><div><div class="name"></div><div class="model"></div></div>' +
        '<div class="status"><span class="dot"></span><span class="label"></span></div>' +
        '<div class="eta"></div><div class="loaded"></div><div class="needs"></div>' +
        '<div class="btns"><button type="button" class="main"></button>' +
        '<button type="button" class="mini pause"><svg viewBox="0 0 20 20" aria-hidden="true">' +
        '<rect x="4" y="3" width="4.5" height="14" rx="1"/><rect x="11.5" y="3" width="4.5" height="14" rx="1"/></svg></button>' +
        '<button type="button" class="mini stop"><svg viewBox="0 0 20 20" aria-hidden="true">' +
        '<rect x="3.5" y="3.5" width="13" height="13" rx="2"/></svg></button></div>' +
        '<div class="msg" role="status"></div>';
      el.querySelector('.name').textContent = p.name;
      el.querySelector('.cam').alt = 'Camera: ' + p.name;
      el.querySelector('.main').addEventListener('click', () => press(p.name));
      el.querySelector('.pause').addEventListener('click', () => askThenSend(p.name, 'pause'));
      el.querySelector('.stop').addEventListener('click', () => askThenSend(p.name, 'stop'));
      el.querySelector('.pause').setAttribute('aria-label', 'Pause the print on ' + p.name);
      el.querySelector('.stop').setAttribute('aria-label', 'Stop the print on ' + p.name);
      c = { el, state: null };
      cards.set(p.name, c);
    }
    grid.appendChild(c.el);               // keeps DOM order sorted
    const sending = c.el.classList.contains('sending');
    c.state = state;
    c.el.className = 'card ' + state + (sending ? ' sending' : '');
    c.el.querySelector('.model').textContent = p.model || '';
    let label = LABEL[state][0];
    if (state === 'printing' && typeof p.progress === 'number')
      label += ' ' + Math.round(p.progress <= 1 ? p.progress * 100 : p.progress) + '%';
    c.el.querySelector('.label').textContent = label;
    c.el.querySelector('.eta').textContent =
      state === 'printing' ? etaText(p, true) : state === 'paused' ? etaText(p, false) : '';
    const btn = c.el.querySelector('.main');
    const text = armed ? 'Tap again to resume' : LABEL[state][1];
    c.el.classList.toggle('armed', armed);
    btn.textContent = sending ? 'Sending…' : text;
    btn.setAttribute('aria-disabled', !(state === 'plate' || state === 'paused') || sending);
    btn.setAttribute('aria-label', p.name + ': ' + text);
    c.el.querySelector('.msg').textContent = errors.has(p.name) ? errors.get(p.name).text : '';
    if (c.filState !== state) { c.filState = state; renderCardFilament(p.name, c); }   // advice depends on state
  }
  for (const [name, c] of cards) if (!seen.has(name)) { c.el.remove(); cards.delete(name); }
  layout();

  document.getElementById('summary').textContent = printers.length
    ? Object.entries({ plate: 'to clear', ready: 'ready', printing: 'printing',
                       paused: 'paused', offline: 'offline' })
        .filter(([k]) => counts[k]).map(([k, t]) => counts[k] + ' ' + t).join(' · ')
    : '';
  document.title = (counts.plate ? '(' + counts.plate + ') ' : '') + 'Watchtower SetReady';
}

// ---- Page login: when a page password is set, the server answers 401 {login:true} until
// this browser has logged in. Every request goes through this wrapper, which opens the
// login dialog on that answer; polling stops until the login succeeds.
let needLogin = false;
const plainFetch = window.fetch.bind(window);
window.fetch = async (...args) => {
  const r = await plainFetch(...args);
  if (r.status === 401) {
    const body = await r.clone().json().catch(() => ({}));
    if (body.login) showLogin();
  }
  return r;
};
const loginDlg = document.getElementById('login');
function showLogin() {
  needLogin = true;
  clearTimeout(timer);
  for (const d of document.querySelectorAll('dialog[open]')) if (d !== loginDlg) d.close();
  if (loginDlg.open) return;
  document.getElementById('login-error').textContent = '';
  document.getElementById('login-pass').value = '';
  loginDlg.showModal();
}
loginDlg.addEventListener('cancel', e => e.preventDefault());     // Escape can't dismiss it
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('login-error');
  try {
    const r = await plainFetch('api/login', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('login-pass').value }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not log in.');
    needLogin = false;
    loginDlg.close();
    camsAt = 0; queueAt = 0;
    refresh();
  } catch (ex) {
    err.textContent = ex instanceof TypeError ? "Can't reach the SetReady server." : ex.message;
  }
});

let lastPrinters = [];
async function refresh() {
  clearTimeout(timer);
  let delay = POLL_MS;
  try {
    const r = await fetch('api/printers', { cache: 'no-store' });
    const text = await r.text();
    if (needLogin) return;                       // login dialog is up; it restarts polling
    if (r.status === 503 && !askedSetup) { askedSetup = true; openSettings(); }
    if (!r.ok) {
      if (r.status === 429) delay = (parseInt(r.headers.get('Retry-After')) || 30) * 1000;
      throw new Error(explain(r.status, text));
    }
    lastPrinters = printersFrom(JSON.parse(text));
    render(lastPrinters);
    banner.classList.remove('show');
    refreshCams();
    refreshQueue();
    document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    banner.textContent = (e instanceof TypeError ? "Can't reach the SetReady server." : e.message) +
      ' Showing the last known state; buttons may be out of date.';
    banner.classList.add('show');
    if (grid.querySelector('.empty')) grid.querySelector('.empty').textContent = 'No printers loaded.';
  }
  if (!document.hidden) timer = setTimeout(refresh, delay);
}

// Button press. A waiting plate sends set_ready at once. A paused printer sends resume, but
// only on a second tap within a few seconds: resuming moves the machine, so a stray touch
// on a wall tablet must not do it.
const CONFIRM_MS = 4000;
const confirmUntil = new Map();   // printer name -> time until which a second tap resumes

async function press(name) {
  const c = cards.get(name);
  if (!c || c.el.classList.contains('sending')) return;
  const state = c.state;
  if (state !== 'plate' && state !== 'paused') return;
  if (state === 'paused') {
    if (Date.now() >= (confirmUntil.get(name) || 0)) {
      confirmUntil.set(name, Date.now() + CONFIRM_MS);
      render(lastPrinters);
      setTimeout(() => render(lastPrinters), CONFIRM_MS + 50);   // drop the prompt again
      return;
    }
    confirmUntil.delete(name);
  }
  if (state === 'plate') {
    // Warn, but let the person carry on, when the job this printer would pick up needs
    // more of a filament than is left on the spool.
    const job = pickupJob(name), low = job ? shortages(job, name) : [];
    if (low.length) {
      const ok = await ask('Not enough filament on ' + name + '?',
        job.name + ' may run out part-way. ' + low.join('; ') + '.',
        'Set Ready anyway', 'Cancel');
      if (!ok || cards.get(name) !== c || c.state !== 'plate') return;
    }
  }
  send(name, state === 'paused' ? 'resume' : 'set-ready');
}

// Pause and Stop sit beside the main button on a printing card (Stop also on a paused one).
// Both ask first in a dialog; Stop cancels the job for good.
const confirmDlg = document.getElementById('confirm');
let confirmDone = null;
function ask(title, text, okLabel, cancelLabel) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-text').textContent = text;
  document.getElementById('confirm-ok').textContent = okLabel;
  document.getElementById('confirm-cancel').textContent = cancelLabel;
  if (confirmDone) confirmDone(false);
  confirmDlg.returnValue = '';
  confirmDlg.showModal();
  document.getElementById('confirm-cancel').focus();     // Enter must not confirm by accident
  return new Promise(resolve => { confirmDone = resolve; });
}
document.getElementById('confirm-ok').addEventListener('click', () => confirmDlg.close('ok'));
document.getElementById('confirm-cancel').addEventListener('click', () => confirmDlg.close());
confirmDlg.addEventListener('close', () => {
  const done = confirmDone; confirmDone = null;
  if (done) done(confirmDlg.returnValue === 'ok');
});

async function askThenSend(name, action) {
  const c = cards.get(name);
  const allowed = () => c.state === 'printing' || (action === 'stop' && c.state === 'paused');
  if (!c || !allowed() || c.el.classList.contains('sending')) return;
  const ok = action === 'pause'
    ? await ask('Pause ' + name + '?', 'The print stops where it is and can be resumed.',
                'Pause print', 'Keep printing')
    : await ask('Stop ' + name + '?', "The job is cancelled and can't be resumed.",
                'Stop print', c.state === 'paused' ? 'Keep job' : 'Keep printing');
  // The printer may have finished or changed state while the question was open.
  if (ok && cards.get(name) === c && allowed()) send(name, action);
}

async function send(name, action) {
  const c = cards.get(name);
  if (!c || c.el.classList.contains('sending')) return;
  const state = c.state;
  c.el.classList.add('sending');
  errors.delete(name);
  render(lastPrinters);
  try {
    const r = await fetch('api/printers/' + encodeURIComponent(name) + '/' + action,
      { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    if (!r.ok) throw new Error(explain(r.status, await r.text()));
    if (action === 'set-ready') pending.set(name, Date.now() + 15000);
  } catch (e) {
    errors.set(name, { state, text: e instanceof TypeError ? "Can't reach the SetReady server." : e.message });
  }
  c.el.classList.remove('sending');
  render(lastPrinters);
  clearTimeout(timer);
  timer = setTimeout(refresh, 1500);      // give Watchtower a beat, then confirm
}

// ---- Cameras: one snapshot per printer, refreshed with the printer list ----
let camPrinters = new Set(), camsAt = 0;
const camBusy = new Set(), camFails = new Map();

async function loadCams() {
  camsAt = Date.now();
  try {
    const c = await (await fetch('api/cameras', { cache: 'no-store' })).json();
    camPrinters = new Set(c.printers || []);
    document.getElementById('camnote').textContent = c.error || '';
  } catch { /* keep the last list; the printer poll reports a dead server */ }
}

async function refreshCams() {
  if (Date.now() - camsAt > 60000) await loadCams();
  for (const [name, c] of cards) {
    const img = c.el.querySelector('.cam');
    if (!camPrinters.has(name)) { img.hidden = true; continue; }
    if (camBusy.has(name)) continue;            // previous frame still loading
    camBusy.add(name);
    const next = new Image();                   // load off-screen, then swap: no flicker
    next.onload = () => { img.src = next.src; img.hidden = false;
                          camFails.delete(name); camBusy.delete(name); };
    next.onerror = () => { const n = (camFails.get(name) || 0) + 1; camFails.set(name, n);
                           if (n >= 3) img.hidden = true; camBusy.delete(name); };
    next.src = 'api/camera/' + encodeURIComponent(name) + '?t=' + Date.now();
  }
}

// ---- Queue and filament: what each waiting job needs and what each printer has loaded ----
let queueAt = 0, queueBusy = false;

function filamentLabel(f) {
  return [f.type, f.variant].filter(Boolean).join(' ') || 'Filament';
}
function filamentTitle(f) {
  return [filamentLabel(f), f.name, f.color, f.grams != null ? Math.round(f.grams) + ' g' : '',
          f.left != null ? 'about ' + f.left + 'g left' : '', f.slot].filter(Boolean).join(' · ');
}
function swatch(f) {
  const s = document.createElement('span');
  s.className = 'sw';
  if (f.color) s.style.setProperty('--sw', f.color);
  s.title = filamentTitle(f);
  return s;
}
// Colour is shown by the swatch, never as a hex code; the code stays in the tooltip.
function chipText(f) {
  const text = f.name ? f.name + ' ' + filamentLabel(f) : filamentLabel(f);
  // Weight the job uses, when known (job filaments only): "Gold PLA Basic (15g)".
  if (typeof f.grams !== 'number') return text;
  return text + ' (' + (f.grams > 0 && f.grams < 1 ? '<1' : Math.round(f.grams)) + 'g)';
}
function chip(f, missing) {
  const c = document.createElement('span');
  c.className = 'chip' + (missing ? ' missing' : '');
  c.title = filamentTitle(f);
  c.append(swatch(f), chipText(f));
  return c;
}
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

// "Hide jobs with filament loaded": remembered in this browser.
const hideOk = document.getElementById('hide-ok');
let lastQueue = null;
try { hideOk.checked = localStorage.getItem('hideOk') === '1'; } catch { /* no storage */ }
hideOk.addEventListener('change', () => {
  try { localStorage.setItem('hideOk', hideOk.checked ? '1' : '0'); } catch { /* no storage */ }
  if (lastQueue) renderQueue(lastQueue);
});
const jobOk = j => !j.best && (j.printer || j.ready.length);   // a printer has every filament

// Filament lines on one printer card: what is loaded, then advice.
//  - Idle printer (plate waiting, or ready): the advice is about this printer. Either a
//    waiting job can run on it as it is, or we show the least it would take to run one.
//  - Busy printer: only flagged when it is the closest fit for a job no printer can run.
// The waiting job an idle printer would take: the oldest one its loaded filament covers.
function pickupJob(name) {
  const q = lastQueue;
  return ((q && q.jobs) || [])
    .filter(j => j.missing_by && j.missing_by[name] && !j.missing_by[name].length &&
                 (!j.printer || j.printer === name))
    .sort((a, b) => (a.created || '').localeCompare(b.created || '') || a.order - b.order)[0];
}
// Filaments the printer has, but less of than the job uses: ["Red PLA Basic: needs 156g, about 100g left"]
function shortages(j, name) {
  return ((j.short_by || {})[name] || []).map(s => {
    const f = j.filaments[s.i];
    return (f.name ? f.name + ' ' : '') + filamentLabel(f) + ': needs ' + Math.round(f.grams) +
           'g, about ' + s.have + 'g left';
  });
}

function renderCardFilament(name, c) {
  const q = lastQueue;
  const loaded = c.el.querySelector('.loaded'), needs = c.el.querySelector('.needs');
  loaded.replaceChildren();
  needs.replaceChildren();
  if (!q) return;
  const slots = (q.loaded || {})[name];
  if (slots && slots.length) {
    loaded.append('Loaded');
    loaded.append(...slots.map(swatch));
    loaded.setAttribute('aria-label', 'Loaded: ' + slots.map(filamentTitle).join('; '));
  }
  if (c.state === 'plate' || c.state === 'ready') {
    // Jobs this printer could take: unassigned ones for its model, or ones assigned to it.
    const mine = (q.jobs || []).filter(j => j.missing_by && j.missing_by[name] &&
                                            (!j.printer || j.printer === name))
                               // oldest first: longest-waiting job wins a tie
                               .sort((a, b) => (a.created || '').localeCompare(b.created || '') ||
                                               a.order - b.order);
    if (!mine.length) return;
    const runnable = mine.filter(j => !j.missing_by[name].length);
    if (runnable.length) {
      const head = c.state === 'plate' ? 'Set Ready can pick up a waiting job'
                                       : 'Has the filament for a waiting job';
      needs.append(el('b', 'good', head),
                   el('div', '', runnable[0].name +
                      (runnable.length > 1 ? ' (and ' + (runnable.length - 1) + ' more)' : '')));
      const low = shortages(runnable[0], name);
      if (low.length) needs.append(el('b', '', 'Not enough filament loaded'),
                                   el('div', '', low.join('; ')));
    } else {
      // Closest match first (fewest filaments to load); among equals, the oldest job.
      const j = mine.reduce((a, b) => b.missing_by[name].length < a.missing_by[name].length ? b : a);
      const chips = el('div', 'chips');
      chips.append(...j.missing_by[name].map(i => chip(j.filaments[i], true)));
      needs.append(el('b', '', 'No waiting job can run here yet'),
                   el('div', '', 'To run ' + j.name + ', load:'), chips);
    }
    return;
  }
  const want = (q.needs || {})[name];
  if (want && want.length) {
    const chips = el('div', 'chips');
    chips.append(...want.map(f => chip(f, true)));
    needs.append(el('b', '', 'Load for waiting jobs'), chips);
  }
}

function renderQueue(q) {
  lastQueue = q;
  for (const [name, c] of cards) renderCardFilament(name, c);

  const section = document.getElementById('queue'), list = document.getElementById('queue-list');
  const jobs = (q.jobs || []).filter(j => !(hideOk.checked && jobOk(j)));
  const all = q.jobs || [];
  section.hidden = !q.enabled || (!all.length && !q.error);
  document.getElementById('queue-count').textContent = !all.length ? ''
    : jobs.length === all.length ? '(' + all.length + ')'
    : '(' + jobs.length + ' of ' + all.length + ' shown)';
  list.replaceChildren();
  if (q.error) list.append(el('p', 'jmeta', q.error));
  if (all.length && !jobs.length) list.append(el('p', 'jmeta', 'Every waiting job has its filament loaded.'));
  for (const j of jobs) {
    const blocked = !!j.best && !j.printer;
    const ok = jobOk(j);
    const row = el('div', 'job' + (j.best ? ' blocked' : ok ? ' ok' : ''));
    const left = el('div'), right = el('div');
    left.append(el('div', 'jname', j.name));
    const meta = [];
    if (j.copies > 1) meta.push(j.copies + ' copies left');
    if (j.minutes) meta.push(Math.floor(j.minutes / 60) + 'h ' + (j.minutes % 60) + 'm');
    if (j.model) meta.push(j.model);
    left.append(el('div', 'jmeta', meta.join(' · ')));

    const missing = new Set(j.best ? j.best.missing : []);
    const chips = el('div', 'chips');
    j.filaments.forEach((f, i) => chips.append(chip(f, missing.has(i))));
    right.append(chips);

    const verdict = el('div', 'verdict');
    // The missing filaments inline: a swatch and its label each, comma separated.
    const lacking = [];
    for (const i of j.best ? j.best.missing : []) {
      const f = j.filaments[i], item = el('span', 'lack');
      item.append(swatch(f), chipText(f));
      if (lacking.length) lacking.push(', ');
      lacking.push(item);
    }
    if (j.printer && j.best) {
      verdict.append(el('b', '', j.printer + ' is missing: '), ...lacking);
    } else if (j.printer) {
      verdict.textContent = 'Assigned to ' + j.printer + ', which has everything loaded.';
    } else if (j.ready.length) {
      verdict.textContent = 'Can run on ' + j.ready.join(', ') + '.';
    } else if (j.best) {
      verdict.append(el('b', '', 'No printer has all of these. '),
                     'Closest is ' + j.best.printer + ': load ', ...lacking);
    } else {
      verdict.textContent = 'Waiting for a printer.';
    }
    right.append(verdict);
    // Watchtower's "no printers have required filament: PLA #FFFFFF, ..." only repeats the
    // chips above as colour codes, so show its reason only when it says something else.
    if (j.reason && !/#[0-9a-f]{6}/i.test(j.reason)) right.append(el('div', 'reason', 'Watchtower: ' + j.reason));
    row.append(left, right);
    list.append(row);
  }
  layout();
}

async function refreshQueue() {
  if (queueBusy || Date.now() - queueAt < 15000) return;
  queueBusy = true;
  try {
    renderQueue(await (await fetch('api/queue', { cache: 'no-store' })).json());
    queueAt = Date.now();
  } catch { /* keep the last view; the printer poll reports a dead server */ }
  queueBusy = false;
}

// ---- Settings: Watchtower address + API key, saved by the server ----
const dlg = document.getElementById('settings');
const $ = id => document.getElementById(id);
let askedSetup = false, savedUrl = '', hasKey = false, savedUser = '', hasPass = false,
    hasPagePass = false;

function keyHint() {
  const reuse = hasKey && $('cfg-url').value.trim() === savedUrl;
  $('cfg-key').required = !reuse;
  $('cfg-key-hint').textContent = reuse
    ? 'A key is saved. Leave blank to keep it.'
    : hasKey ? 'Re-enter the key when changing the address.'
             : 'From Watchtower; needs the control scope with set_ready.';
  const user = $('cfg-user').value.trim();
  const keepPass = hasPass && user === savedUser && $('cfg-url').value.trim() === savedUrl;
  $('cfg-pass').required = !!user && !keepPass;
  $('cfg-pass-hint').textContent = user && keepPass ? 'A password is saved. Leave blank to keep it.' : '';
  $('cfg-pagepass-hint').textContent = hasPagePass
    ? 'A password is set. Leave blank to keep it; a new one logs out every other device.'
    : 'None set: anyone who can reach this page can press the buttons and change settings. At least 8 characters.';
  $('cfg-remove-row').hidden = !hasPagePass;
  $('cfg-logout').hidden = !hasPagePass;
}

async function openSettings() {
  if (dlg.open) return;
  $('cfg-error').textContent = '';
  $('cfg-pagepass').value = ''; $('cfg-remove').checked = false;
  $('cfg-key').value = '';
  $('cfg-pass').value = '';
  try {
    const c = await (await fetch('api/config', { cache: 'no-store' })).json();
    if (needLogin) return;
    savedUrl = c.url; hasKey = c.hasKey;
    $('cfg-url').value = c.url;
    $('cfg-insecure').checked = c.insecure;
    savedUser = c.username || ''; hasPass = !!c.hasPassword; hasPagePass = !!c.hasPagePassword;
    $('cfg-user').value = savedUser;
  } catch { /* server unreachable: the form still opens, saving will report it */ }
  keyHint();
  dlg.showModal();
}

$('open-settings').addEventListener('click', openSettings);
$('cfg-cancel').addEventListener('click', () => dlg.close());
$('cfg-logout').addEventListener('click', async () => {
  await plainFetch('api/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
  showLogin();
});
$('cfg-url').addEventListener('input', keyHint);
$('cfg-user').addEventListener('input', keyHint);
$('settings-form').addEventListener('submit', async e => {
  e.preventDefault();
  try {
    const r = await fetch('api/config', { method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url: $('cfg-url').value, apiKey: $('cfg-key').value,
                             insecure: $('cfg-insecure').checked,
                             username: $('cfg-user').value, password: $('cfg-pass').value,
                             pagePassword: $('cfg-pagepass').value,
                             removePagePassword: $('cfg-remove').checked }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'Could not save.');
    dlg.close();
    grid.innerHTML = '<p class="empty">Loading printers…</p>';
    cards.clear(); pending.clear(); errors.clear(); lastPrinters = [];
    camsAt = 0; camFails.clear(); queueAt = 0;
    document.getElementById('summary').textContent = '';
    refresh();
  } catch (err) {
    $('cfg-error').textContent = err instanceof TypeError ? "Can't reach the SetReady server." : err.message;
  }
});

document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
refresh();
</script>
</body>
</html>
