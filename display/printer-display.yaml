# Watchtower SetReady printer display
#
# A small touch screen for the front of one printer. It shows the printer's state, what
# filament to load for the next waiting job, and a Set Ready button (hold to press).
#
# Board: ESP32-2432S028 / ESP32-2432S028R ("Cheap Yellow Display"), 2.8" 320x240.
#        Three screen types exist; see screen_model below.
#
# Nothing needs editing. After flashing, the board sets itself up:
#   1. It starts its own Wi-Fi network; join it from a phone and choose your Wi-Fi.
#   2. The screen then shows a web address; open it and enter the SetReady server's
#      address and the display token.
# See README.md in this folder for the full steps.

substitutions:
  device_name: printer-display        # each board adds its own suffix, e.g. printer-display-a1b2c3
  refresh: 10s                         # how often to ask the server
  version: "dev"                       # set by the build to a date and commit, e.g. 2026.11.23-1a2b3c4
  # Where the board looks for newer firmware: the published file list for its screen type.
  # file_suffix is "", "-st7789" or "-ili9342" and is set by the build.
  file_suffix: ""
  update_url: https://github.com/M4-Consulting-Ltd/Watchtower-SetReady/releases/download/display-latest
  # Screen type. These boards ship with one of three screens that look the same:
  #   ESP32-2432S028       ILI9341  (usually the single micro-USB board)
  #   ESP32-2432S028-7789  ST7789   (usually the micro-USB + USB-C board)
  #   ESP32-2432S028-9342  ILI9342  (some micro-USB + USB-C boards)
  screen_model: ESP32-2432S028
  # Which way up the picture is can be changed on the board's own settings page
  # ("Screen: turn upside down"), so these only set how a new board starts out.
  rotation: "90"
  touch_mirror_x: "false"
  touch_mirror_y: "false"
  # Optional: bake values in at build time instead of entering them on the board.
  default_server: ""
  default_token: ""

esphome:
  name: ${device_name}
  friendly_name: Printer display
  project:                             # the version the update check compares against
    name: m4consulting.printer-display
    version: "${version}"
  name_add_mac_suffix: true            # one firmware for every board, unique names
  includes:
    - board-name.h                     # changing the name on the network
  on_boot:
    priority: -100
    then:
      - output.turn_off: led_red
      - output.turn_off: led_green
      - output.turn_off: led_blue
      - script.execute: apply_orientation
      - script.execute: fetch

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

ota:
  - platform: esphome
  # Updates fetched by the board itself (see "update" below).
  - platform: http_request
    on_begin:
      - globals.set: {id: g_updating, value: "true"}
      - component.update: screen
    on_error:
      - globals.set: {id: g_updating, value: "false"}

# No Wi-Fi details are built in. Until it has some (or if they stop working) the board
# runs its own network, named after the device, and a phone that joins it is shown a
# page to pick the real Wi-Fi.
wifi:
  ap: {}
  on_connect:
    - script.execute: fetch
  on_disconnect:
    - script.execute: fetch

mdns:

improv_serial:                         # lets the browser flasher set Wi-Fi over USB too

captive_portal:

http_request:
  verify_ssl: true                     # for the firmware download; the SetReady page is plain http
  timeout: 8s
  # GitHub's download links answer with a redirect whose headers run to several thousand
  # characters; with the default 512 the update check fails before it starts.
  buffer_size_rx: 8192
  buffer_size_tx: 2048

json:

# The board's own settings page (http://<its address>): server address and token.
web_server:
  port: 80
  # The page is our own (settings-page.js), served from the board itself, so it works
  # without internet access. The two empty URLs switch off ESPHome's stock interface.
  js_include: settings-page.js
  js_url: ""
  css_url: ""
  local: false

text:
  - platform: template
    id: cfg_server
    name: SetReady page address (not Watchtower)
    icon: mdi:server
    mode: text
    optimistic: true
    restore_value: true
    max_length: 100
    initial_value: "${default_server}"
    on_value:
      - script.execute: fetch
  # The board's name on the network. Blank = the built-in printer-display-xxxxxx.
  - platform: template
    id: cfg_name
    name: Board name on the network
    icon: mdi:tag-text
    mode: text
    optimistic: true
    restore_value: true
    max_length: 31
    initial_value: ""
  - platform: template
    id: cfg_token
    name: Display token
    icon: mdi:key
    mode: password
    optimistic: true
    restore_value: true
    max_length: 80
    initial_value: "${default_token}"
    on_value:
      - script.execute: fetch
  # New Wi-Fi details for the "Wi-Fi change" button. Not kept after a restart.
  - platform: template
    id: new_wifi_ssid
    name: "Wi-Fi change 1: new network name"
    icon: mdi:wifi
    mode: text
    optimistic: true
    max_length: 32
  - platform: template
    id: new_wifi_password
    name: "Wi-Fi change 2: new network password"
    icon: mdi:wifi-lock
    mode: password
    optimistic: true
    max_length: 64

# Self-update. Every six hours the board reads the published file list for its screen
# type and compares versions. The settings page shows "Firmware update" with an Install
# button when there is a newer one; with "Install updates automatically" switched on, the
# board installs it by itself and restarts.
update:
  - platform: http_request
    id: fw_update
    name: Firmware update
    source: ${update_url}/printer-display${file_suffix}.manifest.json
    update_interval: 6h
    on_update_available:
      - if:
          condition:
            switch.is_on: auto_update
          then:
            - update.perform: fw_update

switch:
  # Turn the picture, and the touch with it, the other way up. Remembered by the board, so
  # it can be mounted with the USB socket on either side.
  - platform: template
    id: flip_screen
    name: "Screen: turn upside down"
    icon: mdi:phone-rotate-landscape
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: apply_orientation
    on_turn_off:
      - script.execute: apply_orientation
  - platform: template
    id: auto_update
    name: Install updates automatically
    icon: mdi:update
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# "Apply and restart" on the settings page. Values are saved as they are entered; this
# restarts the board so it comes up cleanly with them.
button:
  - platform: restart
    name: Apply and restart
    icon: mdi:restart
  # Look for newer firmware now instead of waiting for the six-hourly check.
  - platform: template
    name: Firmware update check now
    icon: mdi:cloud-search
    on_press:
      - update.check: fw_update
  # Move the board to another Wi-Fi network from its settings page: fill in the two
  # "Wi-Fi change" fields, then press this. If the new network can't be joined, the board
  # stays on the one it has.
  - platform: template
    name: "Wi-Fi change 3: connect to new network"
    icon: mdi:wifi-cog
    on_press:
      - if:
          condition:
            lambda: return !id(new_wifi_ssid).state.empty();
          then:
            - text_sensor.template.publish: {id: wifi_change, state: "Trying the new network..."}
            - wifi.configure:
                ssid: !lambda return id(new_wifi_ssid).state;
                password: !lambda return id(new_wifi_password).state;
                save: true
                timeout: 30s
                on_connect:
                  - text_sensor.template.publish: {id: wifi_change, state: "Connected to the new network"}
                  - text.set: {id: new_wifi_password, value: ""}
                  - script.execute: fetch
                on_error:
                  - text_sensor.template.publish: {id: wifi_change, state: "Couldn't join it; still on the old network"}
          else:
            - text_sensor.template.publish: {id: wifi_change, state: "Enter the new network's name first"}

# The setup QR code; its content is set from the screen code below.
qr_code:
  - id: setup_qr
    value: "http://192.168.4.1"
    ecc: LOW

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_addr
      name: IP address
    ssid:
      name: Wi-Fi network in use
    scan_results:
      name: Wi-Fi networks nearby          # what the settings page offers to move to
  - platform: template
    id: name_in_use
    name: Network name in use
  - platform: template
    id: wifi_change
    name: "Wi-Fi change: result"
  # Which firmware this board is running, and for which screen type.
  - platform: template
    id: fw_version
    name: Firmware version
    icon: mdi:tag
    update_interval: 1h
    lambda: return {"${version} (${screen_model})"};

# What the server last told us to show.
globals:
  - {id: g_setup,  type: int,         initial_value: "3"}   # 3 = starting, 2 = needs server/token, 0 = set up
  - {id: g_base,   type: std::string, initial_value: '""'}  # server address, tidied
  - {id: g_url_get,  type: std::string, initial_value: '""'}
  - {id: g_url_post, type: std::string, initial_value: '""'}
  - {id: g_url_undo, type: std::string, initial_value: '""'}
  - {id: g_undo,     type: bool,        initial_value: "false"}  # offer "Not ready"
  - {id: g_auth,     type: std::string, initial_value: '""'}   # "Bearer <token>"
  - {id: g_ok,     type: bool,        initial_value: "false"}
  - {id: g_error,  type: std::string, initial_value: '""'}   # empty until the first reply
  - {id: g_title,  type: std::string, initial_value: '""'}
  - {id: g_state,  type: std::string, initial_value: '""'}
  - {id: g_status, type: std::string, initial_value: '""'}
  - {id: g_sub,    type: std::string, initial_value: '""'}
  - {id: g_left,   type: std::string, initial_value: '""'}   # e.g. "8h 51m"
  - {id: g_done,   type: std::string, initial_value: '""'}   # e.g. "18:57"
  - {id: g_pct,    type: int,         initial_value: "-1"}   # print progress, -1 = unknown
  - {id: g_bar,    type: std::string, initial_value: '""'}   # bar wording when not printing, e.g. "RECEIVING 92%"
  - {id: g_touch_x, type: int,        initial_value: "0"}    # last touch, to show where it landed
  - {id: g_touch_y, type: int,        initial_value: "0"}
  - {id: g_touch_at, type: uint32_t,  initial_value: "0"}
  - {id: g_head,   type: std::string, initial_value: '""'}
  - {id: g_good,   type: bool,        initial_value: "false"}
  - {id: g_job,    type: std::string, initial_value: '""'}
  - {id: g_warn,   type: std::string, initial_value: '""'}
  - {id: g_button, type: std::string, initial_value: '""'}
  - {id: g_fil_n,  type: int,         initial_value: "0"}
  - {id: g_fil_t,  type: "std::array<std::string, 4>"}
  - {id: g_fil_c,  type: "std::array<uint32_t, 4>"}
  - {id: g_sending, type: bool,       initial_value: "false"}
  - {id: g_updating, type: bool,      initial_value: "false"}   # an update is being installed
  # Second page: the jobs waiting for this printer.
  - {id: g_page,    type: int,        initial_value: "0"}     # 0 = printer, 1 = queue
  - {id: g_page_at, type: uint32_t,   initial_value: "0"}     # when the queue page was opened
  - {id: g_q_n,     type: int,        initial_value: "0"}
  - {id: g_q_more,  type: int,        initial_value: "0"}
  - {id: g_q_name,  type: "std::array<std::string, 8>"}
  - {id: g_q_time,  type: "std::array<std::string, 8>"}
  - {id: g_q_ok,    type: "std::array<bool, 8>"}
  - {id: g_q_ncol,  type: "std::array<int, 8>"}
  - {id: g_q_col,   type: "std::array<std::array<uint32_t, 4>, 8>"}
  # Each job's filaments, for the page a tap on a job opens.
  - {id: g_q_fn,    type: "std::array<int, 8>"}
  - {id: g_q_fx,    type: "std::array<int, 8>"}                # filaments beyond the four shown
  - {id: g_q_ft,    type: "std::array<std::array<std::string, 4>, 8>"}
  - {id: g_q_fok,   type: "std::array<std::array<bool, 4>, 8>"}
  - {id: g_q_top,   type: int,        initial_value: "0"}     # first job shown in the list
  - {id: g_q_sel,   type: int,        initial_value: "-1"}    # job opened, -1 = the list
  # Swipe tracking: where the finger went down and where it was last seen.
  - {id: g_sw_x0,   type: int,        initial_value: "0"}
  - {id: g_sw_y0,   type: int,        initial_value: "0"}
  - {id: g_sw_x,    type: int,        initial_value: "0"}
  - {id: g_sw_y,    type: int,        initial_value: "0"}

script:
  # Apply the "turn upside down" setting: rotate the picture half a turn and mirror the
  # touch both ways so a touch still lands where it is drawn.
  - id: apply_orientation
    then:
      - lambda: |-
          bool base_90 = ${rotation} == 90;
          bool flipped = id(flip_screen).state;
          bool use_90 = base_90 != flipped;
          id(screen).set_rotation(use_90 ? display::DISPLAY_ROTATION_90_DEGREES
                                         : display::DISPLAY_ROTATION_270_DEGREES);
          id(touch).set_mirror_x(${touch_mirror_x} != flipped);
          id(touch).set_mirror_y(${touch_mirror_y} != flipped);
      - component.update: screen
  - id: fetch
    mode: restart
    then:
      # Work out where we are in setup, and tidy the server address:
      # "192.168.2.2:8080" and "http://192.168.2.2:8080/" both become "http://192.168.2.2:8080".
      - lambda: |-
          std::string s = id(cfg_server).state;
          while (!s.empty() && (s.back() == '/' || s.back() == ' ')) s.pop_back();
          while (!s.empty() && s.front() == ' ') s.erase(0, 1);
          if (!s.empty() && s.find("://") == std::string::npos) s = "http://" + s;
          id(g_base) = s;
          id(g_url_get) = s + "/api/display";
          id(g_url_post) = s + "/api/display/set-ready";
          id(g_url_undo) = s + "/api/display/not-ready";
          id(g_auth) = "Bearer " + id(cfg_token).state;
          if (!wifi::global_wifi_component->is_connected()) id(g_setup) = 3;
          else if (s.empty() || id(cfg_token).state.empty()) id(g_setup) = 2;
          else id(g_setup) = 0;
      - component.update: screen
      - if:
          condition:
            lambda: return id(g_setup) == 0;
          then:
            - http_request.get:
                url: !lambda return id(g_url_get).c_str();
                request_headers:
                  Authorization: !lambda return id(g_auth).c_str();
                capture_response: true
                max_response_buffer_size: 6144
                on_response:
                  then:
                    - lambda: |-
                        if (response->status_code != 200) {
                          id(g_ok) = false;
                          // SetReady's own refusal mentions the display token. Anything else
                          // answering (Watchtower itself, a router page) is the wrong address.
                          if (response->status_code == 401 && body.find("display token") != std::string::npos)
                            id(g_error) = "Token not accepted";
                          else if (response->status_code == 401 || response->status_code == 404)
                            id(g_error) = "Not a SetReady server";
                          else
                            id(g_error) = std::string("Server error ") + std::to_string(response->status_code);
                          return;
                        }
                        bool parsed = json::parse_json(body, [](JsonObject root) -> bool {
                          id(g_title)  = root["title"]  | "";
                          id(g_state)  = root["state"]  | "";
                          id(g_status) = root["status"] | "";
                          id(g_sub)    = root["sub"]    | "";
                          id(g_left)   = root["left"]   | "";
                          id(g_done)   = root["done"]   | "";
                          id(g_pct)    = root["pct"]    | -1;
                          id(g_bar)    = root["bar"]    | "";
                          id(g_head)   = root["head"]   | "";
                          id(g_good)   = root["good"]   | false;
                          id(g_job)    = root["job"]    | "";
                          id(g_warn)   = root["warn"]   | "";
                          id(g_button) = root["button"] | "";
                          id(g_undo)   = root["undo"]   | false;
                          int n = 0;
                          JsonArray fils = root["fil"];
                          for (JsonObject f : fils) {
                            if (n >= 4) break;
                            id(g_fil_t)[n] = f["t"] | "";
                            const char *hex = f["c"] | "";
                            id(g_fil_c)[n] = strlen(hex) == 6 ? strtoul(hex, nullptr, 16) : 0x808080;
                            n++;
                          }
                          id(g_fil_n) = n;
                          int q = 0;
                          // "jobs" is the longer list with each job's filaments; a server
                          // from before that only sends "queue".
                          bool full = !root["jobs"].isNull();
                          JsonArray jobs = full ? root["jobs"] : root["queue"];
                          for (JsonObject j : jobs) {
                            if (q >= 8) break;
                            id(g_q_name)[q] = j["n"] | "";
                            id(g_q_time)[q] = j["t"] | "";
                            id(g_q_ok)[q] = j["ok"] | false;
                            int k = 0;
                            JsonArray cols = j["c"];
                            for (JsonVariant c : cols) {
                              if (k >= 4) break;
                              const char *hex = c | "";
                              id(g_q_col)[q][k++] = strlen(hex) == 6 ? strtoul(hex, nullptr, 16) : 0x808080;
                            }
                            id(g_q_ncol)[q] = k;
                            int m = 0;
                            JsonArray need = j["f"];
                            for (JsonObject f : need) {
                              if (m >= 4) break;
                              id(g_q_ft)[q][m] = f["t"] | "";
                              id(g_q_fok)[q][m] = f["ok"] | false;
                              m++;
                            }
                            id(g_q_fn)[q] = m;
                            id(g_q_fx)[q] = j["x"] | 0;
                            q++;
                          }
                          id(g_q_n) = q;
                          id(g_q_more) = full ? (root["jmore"] | 0) : (root["more"] | 0);
                          if (id(g_q_sel) >= q) id(g_q_sel) = -1;
                          if (id(g_q_top) >= q) id(g_q_top) = 0;
                          return true;
                        });
                        id(g_ok) = parsed;
                        if (!parsed) id(g_error) = "Bad reply from server";
                    - component.update: screen
                on_error:
                  then:
                    - lambda: |-
                        id(g_ok) = false;
                        id(g_error) = "Can't reach server";
                    - component.update: screen

  - id: set_ready
    mode: single
    then:
      - globals.set: {id: g_sending, value: "true"}
      - component.update: screen
      - http_request.post:
          # The one button is Set Ready on a waiting plate, Not ready on a ready printer.
          url: !lambda |-
            return (id(g_button).empty() && id(g_undo) ? id(g_url_undo) : id(g_url_post)).c_str();
          request_headers:
            Authorization: !lambda return id(g_auth).c_str();
            Content-Type: application/json
          body: "{}"
      - delay: 1500ms                  # give Watchtower a beat
      - globals.set: {id: g_sending, value: "false"}
      - script.execute: fetch

interval:
  # Keep the chosen name on the network in place (see board-name.h).
  - interval: 1s
    then:
      - lambda: |-
          std::string n = board_name::tidy(id(cfg_name).state);
          if (n.empty()) n = App.get_name().c_str();
          board_name::apply(n, wifi::global_wifi_component->is_connected());
          if (id(name_in_use).state != n) id(name_in_use).publish_state(n);
  - interval: ${refresh}
    then:
      - script.execute: fetch

# ---- Screen (pins are fixed on this board) ----
spi:
  - id: tft_spi
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: touch_spi
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm

  # The board's RGB status light (lit when the pin is low). Held off so it doesn't glow.
  - {platform: gpio, pin: {number: GPIO4, inverted: true}, id: led_red}
  - {platform: gpio, pin: {number: GPIO16, inverted: true}, id: led_green}
  - {platform: gpio, pin: {number: GPIO17, inverted: true}, id: led_blue}

light:
  - platform: monochromatic
    output: backlight_pwm
    id: backlight
    name: Backlight
    restore_mode: ALWAYS_ON

font:
  - {file: "gfonts://Roboto@500", id: f_huge,  size: 36}
  - {file: "gfonts://Roboto@500", id: f_big,   size: 24}
  - {file: "gfonts://Roboto",     id: f_text,  size: 18}
  - {file: "gfonts://Roboto",     id: f_small, size: 15}

display:
  - platform: mipi_spi
    id: screen
    model: ${screen_model}             # sets the screen type and its pins
    spi_id: tft_spi
    rotation: ${rotation}
    color_depth: 16
    buffer_size: 25%                   # full colour without needing memory for a whole frame
    data_rate: 20MHz
    update_interval: 500ms
    lambda: |-
      const Color BG(17, 19, 23), CARD(27, 30, 36), TEXT(236, 238, 242), MUTED(154, 163, 178);
      const Color GREEN(53, 183, 101), RED(239, 83, 80), AMBER(240, 162, 46), GO(28, 143, 69);
      it.fill(BG);

      // Shorten text with "..." until it fits a width.
      auto fit = [&](std::string s, display::BaseFont *f, int maxw) -> std::string {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, s.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        if (w <= maxw) return s;
        while (s.size() > 1) {
          s.pop_back();
          std::string t = s + "...";
          it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
          if (w <= maxw) return t;
        }
        return s;
      };

      // A QR code on a white square (phones need the light border), top-left at x, y.
      auto qr = [&](const std::string &value, int x, int y) {
        static std::string shown;
        if (value != shown) { id(setup_qr).set_value(value); shown = value; }
        it.filled_rectangle(x - 8, y - 8, 132, 132, Color(255, 255, 255));
        it.qr_code(x, y, id(setup_qr), Color(0, 0, 0), 4);
      };

      // First-time setup, shown until the board has Wi-Fi, a server address and a token.
      // Each step has a QR code, so nothing has to be typed to get to the right page.
      // Where we are: decided here, every frame, so the screen follows Wi-Fi straight away.
      //   3 = starting up (boot screen), 1 = needs Wi-Fi (the board's own network is up),
      //   2 = needs the server address and token, 0 = set up.
      int stage = id(g_setup);
      if (!wifi::global_wifi_component->is_connected())
        stage = wifi::global_wifi_component->is_ap_active() ? 1 : 3;
      else if (stage == 0 && !id(g_ok) && id(g_error).empty())
        stage = 3;                                             // on Wi-Fi, no reply yet

      if (id(g_updating)) {
        it.print(160, 96, id(f_big), TEXT, TextAlign::CENTER, "Updating firmware");
        it.print(160, 134, id(f_text), GREEN, TextAlign::CENTER, "Please leave it plugged in");
        it.print(160, 170, id(f_small), MUTED, TextAlign::CENTER, "It restarts by itself when done");
        return;
      }

      // Boot screen: shown while joining Wi-Fi and until the server first answers. The setup
      // QR codes only appear if the board really does need setting up.
      if (stage == 3) {
        bool online = wifi::global_wifi_component->is_connected();
        it.print(160, 84, id(f_big), TEXT, TextAlign::CENTER, "Watchtower SetReady");
        it.print(160, 116, id(f_text), MUTED, TextAlign::CENTER, "Printer display");
        it.print(160, 164, id(f_text), GREEN, TextAlign::CENTER,
                 online ? "Contacting server..." : "Connecting to Wi-Fi...");
        it.print(160, 204, id(f_small), MUTED, TextAlign::CENTER,
                 fit(std::string(App.get_name().c_str()), id(f_small), 300).c_str());
        it.print(160, 224, id(f_small), MUTED, TextAlign::CENTER, "Version ${version}");
        return;
      }

      if (stage == 1) {
        std::string ap = std::string(App.get_name().c_str());
        it.filled_rectangle(0, 0, 320, 38, CARD);
        it.print(12, 19, id(f_big), TEXT, TextAlign::CENTER_LEFT, "Setup 1 of 2: Wi-Fi");
        qr("WIFI:S:" + ap + ";T:nopass;;", 188, 56);          // joins the board's own network
        it.print(12, 50, id(f_text), TEXT, "Scan with your");
        it.print(12, 72, id(f_text), TEXT, "phone's camera");
        it.print(12, 94, id(f_text), TEXT, "to join the");
        it.print(12, 116, id(f_text), TEXT, "board's Wi-Fi.");
        it.print(12, 148, id(f_small), MUTED, "Then choose your");
        it.print(12, 166, id(f_small), MUTED, "own Wi-Fi on the");
        it.print(12, 184, id(f_small), MUTED, "page that opens.");
        it.print(12, 214, id(f_small), GREEN, fit(ap, id(f_small), 296).c_str());
        return;
      }
      if (stage == 2) {
        std::string url = "http://" + id(ip_addr).state;
        it.filled_rectangle(0, 0, 320, 38, CARD);
        it.print(12, 19, id(f_big), TEXT, TextAlign::CENTER_LEFT, "Setup 2 of 2: Server");
        qr(url, 188, 56);                                       // opens the board's settings page
        it.print(12, 50, id(f_text), TEXT, "Scan to open");
        it.print(12, 72, id(f_text), TEXT, "this board's");
        it.print(12, 94, id(f_text), TEXT, "settings.");
        it.print(12, 126, id(f_small), MUTED, "Enter the SetReady");
        it.print(12, 144, id(f_small), MUTED, "address and token,");
        it.print(12, 162, id(f_small), MUTED, "then press Apply");
        it.print(12, 180, id(f_small), MUTED, "and restart.");
        it.print(12, 214, id(f_small), GREEN, fit(url, id(f_small), 296).c_str());
        return;
      }
      if (!id(g_ok)) {
        std::string url = "http://" + id(ip_addr).state;
        it.filled_rectangle(0, 0, 320, 38, CARD);
        it.print(12, 19, id(f_big), AMBER, TextAlign::CENTER_LEFT, fit(id(g_error), id(f_big), 296).c_str());
        qr(url, 188, 56);                                       // the board's settings page
        it.print(12, 50, id(f_text), TEXT, "Scan to check");
        it.print(12, 72, id(f_text), TEXT, "this board's");
        it.print(12, 94, id(f_text), TEXT, "settings.");
        it.print(12, 126, id(f_small), MUTED, "Server:");
        it.print(12, 144, id(f_small), MUTED, fit(id(g_base), id(f_small), 164).c_str());
        it.print(12, 214, id(f_small), GREEN, fit(url, id(f_small), 296).c_str());
        return;
      }

      // Two small dots in the top bar show which of the two pages is on screen.
      auto pager = [&](int page) {
        it.filled_circle(262, 19, 3, page == 0 ? TEXT : MUTED);
        it.filled_circle(274, 19, 3, page == 1 ? TEXT : MUTED);
      };

      // Page 2 (swipe, or tap the top bar): the jobs waiting for this printer, in
      // Watchtower's order. It goes back to the printer page by itself after 30 seconds.
      if (id(g_page) == 1 && millis() - id(g_page_at) > 30000) id(g_page) = 0;
      if (id(g_page) == 1) {
        it.filled_rectangle(0, 0, 320, 38, CARD);
        it.print(12, 19, id(f_big), TEXT, TextAlign::CENTER_LEFT, fit(id(g_title) + " queue", id(f_big), 236).c_str());
        pager(1);
        if (id(g_q_n) == 0) {
          it.print(160, 120, id(f_text), MUTED, TextAlign::CENTER, "No jobs waiting");
          it.print(160, 146, id(f_small), MUTED, TextAlign::CENTER, "for this printer");
        }
        // A job was tapped: what it needs, and whether this printer has each one loaded.
        if (id(g_q_sel) >= 0 && id(g_q_sel) < id(g_q_n)) {
          int s = id(g_q_sel);
          bool ok = id(g_q_ok)[s];
          it.print(12, 44, id(f_text), TEXT, fit(id(g_q_name)[s], id(f_text), 296).c_str());
          std::string line = ok ? "Ready to run here" : "Needs filament loading";
          if (!id(g_q_time)[s].empty()) line += "  -  " + id(g_q_time)[s];
          it.print(12, 68, id(f_small), ok ? GREEN : RED, line.c_str());
          if (id(g_q_fn)[s] == 0)
            it.print(12, 100, id(f_small), MUTED, "No filament details for this job");
          for (int k = 0; k < id(g_q_fn)[s]; k++) {
            int y = 96 + k * 30;
            uint32_t c = k < id(g_q_ncol)[s] ? id(g_q_col)[s][k] : 0x808080;
            bool have = id(g_q_fok)[s][k];
            it.filled_circle(22, y + 11, 9, Color((c >> 16) & 0xFF, (c >> 8) & 0xFF, c & 0xFF));
            it.circle(22, y + 11, 9, MUTED);
            it.print(312, y + 3, id(f_small), have ? GREEN : RED, TextAlign::TOP_RIGHT, have ? "loaded" : "LOAD");
            it.print(40, y, id(f_text), TEXT, fit(id(g_q_ft)[s][k], id(f_text), 210).c_str());
          }
          it.print(160, 221, id(f_small), MUTED, TextAlign::TOP_CENTER,
                   id(g_q_fx)[s] > 0 ? ("+" + std::to_string(id(g_q_fx)[s]) + " more filaments   tap to go back").c_str()
                                     : "Tap to go back");
          return;
        }
        // The list, four at a time. Tap a job to open it; tap the bottom line (or swipe
        // up or down) for the next four.
        int top = id(g_q_top);
        for (int i = top; i < id(g_q_n) && i < top + 4; i++) {
          int y = 44 + (i - top) * 44;
          Color edge = id(g_q_ok)[i] ? GREEN : RED;          // has the filament / needs loading
          it.filled_rectangle(4, y + 2, 4, 38, edge);
          int tw = 0, x1, y1, th;
          if (!id(g_q_time)[i].empty()) {
            it.get_text_bounds(0, 0, id(g_q_time)[i].c_str(), id(f_small), TextAlign::TOP_LEFT, &x1, &y1, &tw, &th);
            it.print(312, y + 2, id(f_small), MUTED, TextAlign::TOP_RIGHT, id(g_q_time)[i].c_str());
          }
          it.print(16, y, id(f_text), TEXT, fit(id(g_q_name)[i], id(f_text), 290 - tw).c_str());
          for (int k = 0; k < id(g_q_ncol)[i]; k++) {
            uint32_t c = id(g_q_col)[i][k];
            it.filled_circle(23 + k * 18, y + 32, 6, Color((c >> 16) & 0xFF, (c >> 8) & 0xFF, c & 0xFF));
            it.circle(23 + k * 18, y + 32, 6, MUTED);
          }
          it.print(100, y + 23, id(f_small), edge, id(g_q_ok)[i] ? "ready to run" : "needs filament");
        }
        int total = id(g_q_n) + id(g_q_more);
        if (id(g_q_n) > 4) {
          int last = top + 4 < id(g_q_n) ? top + 4 : id(g_q_n);
          it.print(160, 221, id(f_small), MUTED, TextAlign::TOP_CENTER,
                   (std::to_string(top + 1) + "-" + std::to_string(last) + " of " + std::to_string(total) +
                    "   tap here for more").c_str());
        } else if (id(g_q_more) > 0) {
          it.print(160, 221, id(f_small), MUTED, TextAlign::TOP_CENTER,
                   ("+" + std::to_string(id(g_q_more)) + " more").c_str());
        }
        return;
      }

      // Header: printer name, with a dot in the state colour.
      const std::string &st = id(g_state);
      Color dot = st == "ready" ? GREEN : st == "offline" ? AMBER : st == "unknown" ? MUTED : RED;
      it.filled_rectangle(0, 0, 320, 38, CARD);
      it.print(12, 19, id(f_big), TEXT, TextAlign::CENTER_LEFT, fit(id(g_title), id(f_big), 236).c_str());
      it.filled_circle(298, 19, 9, dot);
      pager(0);

      bool printing = st == "printing";
      bool bar = !id(g_bar).empty();        // a job is being sent to the printer
      bool advice = !id(g_head).empty();
      int y = 96;

      if (printing && !advice && !id(g_left).empty()) {
        // Printing with nothing to load: use the space for the two things worth reading
        // from across the room.
        it.print(12, 46, id(f_small), MUTED, "Estimated time left");
        it.print(12, 62, id(f_huge), TEXT, id(g_left).c_str());
        it.print(12, 112, id(f_small), MUTED, "Estimated completion");
        it.print(12, 128, id(f_huge), TEXT, id(g_done).c_str());
      } else if (printing) {
        // Printing, with filament to load for a waiting job: times on one line, then advice.
        it.print(12, 46, id(f_text), TEXT, fit(id(g_sub).empty() ? id(g_status) : id(g_sub), id(f_text), 296).c_str());
        y = 74;
      } else {
        it.print(12, 46, id(f_text), TEXT, fit(id(g_status), id(f_text), 296).c_str());
        if (!id(g_sub).empty())
          it.print(12, 70, id(f_small), MUTED, fit(id(g_sub), id(f_small), 296).c_str());
      }

      // Advice: a heading, the job, then the filament to load or a warning.
      if (advice) {
        it.print(12, y, id(f_text), id(g_good) ? GREEN : RED, fit(id(g_head), id(f_text), 296).c_str());
        y += 24;
      }
      if (!id(g_job).empty()) {
        it.print(12, y, id(f_small), TEXT, fit(id(g_job), id(f_small), 296).c_str());
        y += 22;
      }
      bool undo = id(g_button).empty() && id(g_undo);    // ready: offer to take it back
      bool button = !id(g_button).empty() || undo;
      int bottom = (button || printing || bar) ? 182 : 236;
      for (int i = 0; advice && i < id(g_fil_n) && y + 20 <= bottom; i++) {
        uint32_t c = id(g_fil_c)[i];
        it.filled_circle(22, y + 10, 9, Color((c >> 16) & 0xFF, (c >> 8) & 0xFF, c & 0xFF));
        it.circle(22, y + 10, 9, MUTED);
        it.print(40, y, id(f_text), TEXT, fit(id(g_fil_t)[i], id(f_text), 268).c_str());
        y += 24;
      }
      if (!id(g_warn).empty() && y + 18 <= bottom)
        it.print(12, y, id(f_small), AMBER, fit(id(g_warn), id(f_small), 296).c_str());

      // Bottom bar. Plate waiting: the Set Ready button (hold for a second).
      // Printing: the same bar as a progress bar, filled in green as the print goes on.
      if (button) {
        bool held = id(btn_touch).state;
        if (undo) {
          // Quieter than Set Ready: an outline, so it doesn't read as the thing to press.
          it.filled_rectangle(10, 186, 300, 48, id(g_sending) || held ? MUTED : CARD);
          it.rectangle(10, 186, 300, 48, MUTED);
        } else {
          it.filled_rectangle(10, 186, 300, 48, id(g_sending) ? MUTED : held ? GREEN : GO);
        }
        it.print(160, 210, id(f_big), Color(255, 255, 255), TextAlign::CENTER,
                 id(g_sending) ? "Sending..." : held ? "Keep holding..."
                 : undo ? "Hold: Not ready" : "Hold: Set Ready");
      } else if (printing || bar) {
        int pct = id(g_pct) < 0 ? 0 : id(g_pct) > 100 ? 100 : id(g_pct);
        it.filled_rectangle(10, 186, 300, 48, CARD);
        if (pct > 0) it.filled_rectangle(10, 186, 300 * pct / 100, 48, GO);
        it.rectangle(10, 186, 300, 48, GO);
        std::string label = bar ? id(g_bar)
                          : id(g_pct) < 0 ? std::string("PRINTING") : "PRINTING " + std::to_string(pct) + "%";
        it.print(160, 210, id(f_big), Color(255, 255, 255), TextAlign::CENTER, label.c_str());
      }

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: touch_spi
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    # If touches land in the wrong place, adjust these (see README.md).
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      swap_xy: true
      mirror_x: ${touch_mirror_x}
      mirror_y: ${touch_mirror_y}
    on_touch:
      - lambda: |-
          id(g_touch_x) = touch.x;
          id(g_touch_y) = touch.y;
          id(g_touch_at) = millis();
          ESP_LOGI("touch", "x=%d y=%d (raw %d, %d)", touch.x, touch.y, touch.x_raw, touch.y_raw);
          id(g_sw_x0) = id(g_sw_x) = touch.x;
          id(g_sw_y0) = id(g_sw_y) = touch.y;
    on_update:
      - lambda: |-
          for (auto &t : touches) { id(g_sw_x) = t.x; id(g_sw_y) = t.y; }
    # Finger lifted: a sideways swipe, or a tap on the top bar, switches page.
    on_release:
      - lambda: |-
          int dx = id(g_sw_x) - id(g_sw_x0), dy = id(g_sw_y) - id(g_sw_y0);
          bool swipe = abs(dx) > 60 && abs(dy) < 60;
          bool tap = abs(dx) < 20 && abs(dy) < 20;
          bool tap_bar = tap && id(g_sw_y0) < 40;
          if (id(g_setup) != 0 || !id(g_ok)) return;
          if (swipe || tap_bar) {
            id(g_page) = id(g_page) == 0 ? 1 : 0;
            id(g_page_at) = millis();
            id(g_q_sel) = -1;
            id(g_q_top) = 0;
          } else if (id(g_page) == 1) {
            // On the queue page: a tap opens a job (and any tap closes it again); the
            // bottom line, or a swipe up or down, moves through the list four at a time.
            int n = id(g_q_n), top = id(g_q_top);
            bool up = dy < -60 && abs(dx) < 60, down = dy > 60 && abs(dx) < 60;
            if (id(g_q_sel) >= 0) {
              if (tap) id(g_q_sel) = -1;
            } else if ((tap && id(g_sw_y0) >= 220 && n > 4) || up) {
              id(g_q_top) = top + 4 < n ? top + 4 : (up ? top : 0);
            } else if (down) {
              id(g_q_top) = top >= 4 ? top - 4 : 0;
            } else if (tap && id(g_sw_y0) >= 44) {
              int row = top + (id(g_sw_y0) - 44) / 44;
              if (row < n && row < top + 4) id(g_q_sel) = row;
            }
            id(g_page_at) = millis();          // still in use: don't flip back yet
          }
      - component.update: screen

binary_sensor:
  # Finger on the button area: used to draw the "keep holding" state.
  - platform: touchscreen
    id: btn_touch
    touchscreen_id: touch
    x_min: 10
    x_max: 310
    y_min: 186
    y_max: 234
  # The same area, but only "on" after a one-second hold: this sends Set Ready.
  - platform: touchscreen
    id: btn_held
    touchscreen_id: touch
    x_min: 10
    x_max: 310
    y_min: 186
    y_max: 234
    filters:
      - delayed_on: 1s
    on_press:
      - if:
          condition:
            lambda: return (!id(g_button).empty() || id(g_undo)) && !id(g_sending);
          then:
            - script.execute: set_ready
